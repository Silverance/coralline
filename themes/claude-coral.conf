# Subagent panel: subseg_name tints the label by task status out of the main
# VL_FG_* palette, which is tuned for the gauge segments' dark ground. Giving the
# name pill that same ground keeps every status legible in this theme's own light
# inks. Targets are WCAG AA for normal-size text (terminal type is not 'large'
# even in bold), checked against both this pill and the uniform bar
# VL_STYLE="classic" paints instead; running sits a step higher so it never
# collides with the dim tint. These are candidates, not the public knobs:
# statusline.sh adopts them only while _VL_SUB_FP still matches the live palette,
# so a config that retints VL_FG_* after sourcing this theme keeps its own colors.
_VL_SUB_BG_NAME="68,68,68"     # dark ground, same family as the gauge segments
_VL_SUB_FG_TEXT="255,255,255"  # running (9.74 pill / 9.74 classic bar)
_VL_SUB_FG_OK=""               # completed falls through at 5.61 / 5.61
_VL_SUB_FG_HOT="231,157,157"   # failed (4.50 / 4.50)
_VL_SUB_FG_DIM="177,177,177"   # unknown (4.54 / 4.54)
_VL_SUB_FP="81,166,199|231|114|167|245"
_VL_SUB_BAR="|"

# Segments added by this fork. Values are palette-native (theme hue, lightness
# adjusted) and contrast-checked against the ink each segment actually draws with:
# VL_FG_TEXT for worktree/vim/custom/conflict, VL_FG_DIM for the dim metadata trio,
# and VL_FG_OK/WARN/HOT for cache. Ratios in comments are the worst case per pill.
VL_BG_WORKTREE="95,95,135"        # 6.05:1 — location badge
VL_BG_VIM="175,95,0"              # 4.71:1 — editor mode
VL_BG_CUSTOM="129,91,129"         # 5.60:1 — VL_CUSTOM_CMD output
VL_BG_CONFLICT="166,42,42"        # 7.03:1 — unmerged paths (loudest)
VL_BG_CACHE="27,27,27"            # 4.67:1 — gauge ground; text is value-coloured
VL_BG_SHA="47,64,70"              # 3.13:1 — dim metadata, dir tint
VL_BG_VERSION="73,57,49"          # 3.18:1 — dim metadata, model tint
VL_BG_SESSION="55,63,55"          # 3.15:1 — dim metadata, git tint
